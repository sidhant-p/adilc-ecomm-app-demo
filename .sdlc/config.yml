# sdlc-flightdeck config for a team that INSTALLS the plugin.
# Copy to .sdlc/config.yml at the root of the repo you want the plugin to govern.
# Read directly by the skills — there is no loader or schema.
repo:
  owner: sidhant-p
  name: adilc-ecomm-app-demo
intake:
  dir: docs/spec             # optional, default: docs/spec
  pr_base: master             # optional, default: master (some teams: a release branch)
spec:
  dir: specs                # optional, default: specs
  pr_base: main              # optional, default: main
tracker:
  type: github          # only "github" supported this cycle; any other value fails loud
draft:
  dir: sdlc/docs        # optional, default: sdlc/docs — parent of <type>-ready/<basename>/ story files
  label: spec-approved  # optional, default: spec-approved — the issue label that gates tracker-draft
dev:
  plan:
    dir: plans                                   # optional, default: plans
    pr_base: main                                # optional, default: main
    ready_label: Ready For Development           # optional, default: Ready For Development — human-applied gate; dev-plan won't pick up a story without it
    in_progress_label: Dev Planning In Progress  # optional, default: Dev Planning In Progress — dev-plan swaps to this on pickup
  implement:
    test_command: node --test   # optional, default: node --test
    branch_prefix: sdlc/dev-implement-  # optional, default: sdlc/dev-implement-
    pr_base: main               # optional, default: main
test:
  dir: sdlc/tests   # optional, default: sdlc/tests — where <id>.md test-design docs live
  pr_base: main     # optional, default: main — base for the test-plan / test-author PRs
